<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="UK cinema releases this week and coming soon, with release dates, certificates, running times and critic reviews.">
<title>UK Cinema Releases</title>
<style>
:root{color-scheme:light;--ink:#17202a;--muted:#596575;--line:#dce2e8;--paper:#fff;--accent:#245b8f;--tab:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:36px 22px 64px}header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:20px}
h1{font-size:clamp(2rem,6vw,2.7rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.04em}h2{font-size:1.35rem;margin:30px 0 12px}h3{font-size:1.05rem;margin:0 0 4px}
.meta,.muted{color:var(--muted);font-size:.9rem}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:0 0 22px}
.tab{appearance:none;border:0;border-radius:7px 7px 0 0;padding:10px 17px;background:var(--tab);color:var(--ink);font:inherit;font-weight:650;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:white}.panel[hidden]{display:none}
.film{padding:17px 0;border-bottom:1px solid var(--line)}.film-title{font-size:1.13rem;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.details{font-size:.9rem;color:var(--muted);margin:3px 0 8px}.review{margin:8px 0 4px}.synopsis{margin:6px 0 0}
.sources{font-size:.86rem}.sources a{margin-right:12px}a{color:var(--accent)}
footer{margin-top:38px;border-top:1px solid var(--line);padding-top:15px}.empty{padding:18px;background:#f4f6f8;border-radius:8px;color:var(--muted)}
</style></head>
<body><main>
<header><h1>UK Cinema Releases</h1><div class="meta" id="week">Loading releases…</div><div class="meta" id="updated"></div></header>
<nav class="tabs" role="tablist" aria-label="Film release period">
<button class="tab" id="tab-week" role="tab" aria-selected="true" aria-controls="panel-week">This week</button>
<button class="tab" id="tab-coming" role="tab" aria-selected="false" aria-controls="panel-coming">Coming soon</button>
</nav>
<section class="panel" id="panel-week" role="tabpanel" aria-labelledby="tab-week"><div id="current-content" aria-live="polite"></div></section>
<section class="panel" id="panel-coming" role="tabpanel" aria-labelledby="tab-coming" hidden><div id="coming-content" aria-live="polite"></div></section>
<footer class="meta">Release dates: <a href="https://filmdistributorsassociation.com/print-release-schedule/">Film Distributors’ Association</a>. Certificates and running times are shown only when verified. Reviews link to their original critic sources. <a href="archive.html">Previous weeks</a></footer>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const google=t=>"https://www.google.com/search?q="+encodeURIComponent(t+" showtimes Bristol");
function tabs(){const pairs=[["tab-week","panel-week"],["tab-coming","panel-coming"]];for(const [button,panel] of pairs){document.getElementById(button).addEventListener("click",()=>{for(const [b,p] of pairs){const active=b===button;document.getElementById(b).setAttribute("aria-selected",String(active));document.getElementById(p).hidden=!active}})}}
function card(f,coming=false){const el=document.createElement("article");el.className="film";const details=[f.certificate,f.runtime,f.release_date?new Date(f.release_date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""].filter(Boolean).join(" · ");const review=!coming&&f.review?'<p class="review">'+esc(f.review)+'</p>':"";const synopsis=coming&&f.synopsis?'<p class="synopsis">'+esc(f.synopsis)+'</p>':"";const links=!coming?(f.sources||[]).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.outlet)+'</a>').join(""):"";el.innerHTML='<h3><a class="film-title" href="'+google(f.title)+'" target="_blank" rel="noopener">'+esc(f.title)+'</a></h3>'+(details?'<div class="details">'+esc(details)+'</div>':"")+review+synopsis+(links?'<div class="sources">Critics: '+links+'</div>':"");return el}
async function load(){const currentRoot=document.getElementById("current-content"),comingRoot=document.getElementById("coming-content");try{const [cr,ur]=await Promise.all([fetch("data/current.json?"+Date.now()),fetch("data/coming-soon.json?"+Date.now())]);if(!cr.ok)throw Error("current");const d=await cr.json();const coming=ur.ok?await ur.json():{films:[]};document.getElementById("week").textContent=d.week_label||"This week's releases";document.getElementById("updated").textContent="Last updated: "+(d.updated||"date unavailable");
for(const [label,films] of [["New releases",(d.films||[]).filter(x=>!x.rerelease)],["Re-releases",(d.films||[]).filter(x=>x.rerelease)]]){if(!films.length)continue;films.sort((a,b)=>(Number(!!b.review)-Number(!!a.review))||(Number(!!b.certificate)-Number(!!a.certificate))||a.title.localeCompare(b.title));const h=document.createElement("h2");h.textContent=label;currentRoot.append(h);films.forEach(f=>currentRoot.append(card(f)))}
if(!d.films?.length)currentRoot.innerHTML='<p class="empty">The release feed has not populated yet. The weekly update runs automatically on Thursday evenings.</p>';
const upcoming=coming.films||[];let last="";for(const f of upcoming){const group=f.release_date.slice(0,7);if(group!==last){const h=document.createElement("h2");h.textContent=new Date(f.release_date+"T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"});comingRoot.append(h);last=group}comingRoot.append(card(f,true))}
if(!upcoming.length)comingRoot.innerHTML='<p class="empty">No upcoming films with confirmed release dates and verified descriptions are listed yet.</p>';
}catch(e){currentRoot.innerHTML='<p class="empty">The release list is temporarily unavailable. Please try again later.</p>';comingRoot.innerHTML='<p class="empty">The upcoming list is temporarily unavailable. Please try again later.</p>'}}
tabs();load();
</script></body></html>
