<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="UK cinema releases this week and coming soon, with release dates, certificates, running times and critic reviews.">
<title>Cinema Releases</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500;600;700&display=swap');
:root{color-scheme:light;--ink:#17202a;--muted:#596575;--line:#000;--paper:#fff;--accent:#245b8f;--tab:#eef2f6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'Roboto',sans-serif}
main{max-width:780px;margin:0 auto;padding:0 22px 64px}.masthead{position:sticky;top:0;z-index:20;background:var(--paper);padding:18px 0 0;box-shadow:0 1px 0 var(--line)}header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:0}
h1,h2,h3{font-family:'Roboto Condensed',sans-serif;font-weight:700}h1{font-size:clamp(2rem,6vw,2.7rem);line-height:1.1;margin:0 0 2px;letter-spacing:-.025em}h2{font-size:1.45rem;margin:30px 0 12px}h3{font-size:1.45rem;line-height:1.2;margin:0}
.meta,.muted{color:var(--muted);font-size:.9rem}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0;padding-top:12px}
.tab{appearance:none;border:1px solid var(--line);border-bottom:0;border-radius:0;padding:10px 17px;background:var(--tab);color:var(--ink);font:500 1rem 'Roboto',sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:#000;color:#fff;border-color:#000}.nav-archive{margin-left:auto;align-self:center;padding:8px 0 8px 14px;white-space:nowrap;font-size:.9rem}.panel[hidden]{display:none}
.film{padding:17px 0;border-bottom:1px solid var(--line)}.film-title{font-size:1.45rem;font-weight:700;color:var(--accent)}
.details{font-size:.9rem;color:var(--muted);margin:0 0 8px}.review{margin:8px 0 4px}.synopsis{margin:6px 0 0}
.sources{font-size:.86rem}.sources a{margin-right:12px}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}a:active{color:red}
footer{margin-top:38px;border-top:1px solid var(--line);padding-top:15px}.empty{padding:18px;background:#f4f6f8;border-radius:8px;color:var(--muted)}
</style></head>
<body><main>
<div class="masthead"><header><h1>Cinema Releases</h1><div class="meta" id="updated"></div></header>
<nav class="tabs" role="tablist" aria-label="Film release period">
<button class="tab" id="tab-week" role="tab" aria-selected="true" aria-controls="panel-week">This week</button>
<button class="tab" id="tab-coming" role="tab" aria-selected="false" aria-controls="panel-coming">Coming soon</button>
<a class="nav-archive" href="archive.html">Previous weeks</a>
</nav></div>
<section class="panel" id="panel-week" role="tabpanel" aria-labelledby="tab-week"><div id="current-content" aria-live="polite"></div></section>
<section class="panel" id="panel-coming" role="tabpanel" aria-labelledby="tab-coming" hidden><div id="coming-content" aria-live="polite"></div></section>
<footer class="meta">Release dates: <a href="https://filmdistributorsassociation.com/print-release-schedule/">Film Distributors’ Association</a>.</footer>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const google=t=>"https://www.google.com/search?q="+encodeURIComponent(t+" showtimes Bristol");
function tabs(){const pairs=[["tab-week","panel-week"],["tab-coming","panel-coming"]];for(const [button,panel] of pairs){document.getElementById(button).addEventListener("click",()=>{for(const [b,p] of pairs){const active=b===button;document.getElementById(b).setAttribute("aria-selected",String(active));document.getElementById(p).hidden=!active}})}}
function formatDate(value,options={day:"numeric",month:"short",year:"numeric"}){if(!value)return "";const d=new Date(value+"T12:00:00");return d.toLocaleDateString("en-GB",{weekday:"short",...options}).replace(/,/g,"")}
function card(f,coming=false){const el=document.createElement("article");el.className="film";const details=[f.genre,f.certificate,f.runtime,formatDate(f.release_date)].filter(Boolean).join(" · ");const summary=!coming?(f.review||f.synopsis):f.synopsis;const review=summary?'<p class="review">'+esc(summary)+'</p>':"";const synopsis="";const links=!coming?(f.sources||[]).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.outlet)+'</a>').join(""):"";el.innerHTML='<h3><a class="film-title" href="'+google(f.title)+'" target="_blank" rel="noopener">'+esc(f.title)+'</a></h3>'+(details?'<div class="details">'+esc(details)+'</div>':"")+review+synopsis+(links?'<div class="sources">Critics: '+links+'</div>':"");return el}
async function load(){const currentRoot=document.getElementById("current-content"),comingRoot=document.getElementById("coming-content");try{const [cr,ur]=await Promise.all([fetch("data/current.json?"+Date.now()),fetch("data/coming-soon.json?"+Date.now())]);if(!cr.ok)throw Error("current");const d=await cr.json();const coming=ur.ok?await ur.json():{films:[]};const weekMatch=(d.week_label||"").match(/(\d{1,2} [A-Za-z]+ \d{4})/);const weekDate=weekMatch?new Date(weekMatch[1]+" 12:00:00"):null;const weekHeading=document.createElement("div");weekHeading.className="meta";weekHeading.textContent=weekDate?"Week commencing "+weekDate.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/,/g,""):(d.week_label||"This week's releases");currentRoot.append(weekHeading);document.getElementById("updated").textContent="Last updated: "+formatDate(d.updated?new Date(d.updated+" 12:00:00").toISOString().slice(0,10):"");
for(const [label,films] of [["New releases",(d.films||[]).filter(x=>!x.rerelease)],["Re-releases",(d.films||[]).filter(x=>x.rerelease)]]){if(!films.length)continue;films.sort((a,b)=>(Number(!!b.review)-Number(!!a.review))||(Number(!!b.certificate)-Number(!!a.certificate))||a.title.localeCompare(b.title));const h=document.createElement("h2");h.textContent=label;currentRoot.append(h);films.forEach(f=>currentRoot.append(card(f)))}
if(!d.films?.length)currentRoot.innerHTML='<p class="empty">The release feed has not populated yet. The weekly update runs automatically on Thursday evenings.</p>';
const upcoming=[...(coming.films||[])].sort((a,b)=>a.release_date.localeCompare(b.release_date)||a.title.localeCompare(b.title));let last="";for(const f of upcoming){const release=new Date(f.release_date+"T12:00:00");const weekStart=new Date(release);weekStart.setDate(release.getDate()-((release.getDay()+2)%7));const group=weekStart.toISOString().slice(0,10);if(group!==last){const h=document.createElement("h2");h.textContent="Week commencing "+weekStart.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).replace(/,/g,"");comingRoot.append(h);last=group}comingRoot.append(card(f,true))}
if(!upcoming.length)comingRoot.innerHTML='<p class="empty">No upcoming films with confirmed release dates and verified descriptions are listed yet.</p>';
}catch(e){currentRoot.innerHTML='<p class="empty">The release list is temporarily unavailable. Please try again later.</p>';comingRoot.innerHTML='<p class="empty">The upcoming list is temporarily unavailable. Please try again later.</p>'}}
tabs();load();
</script></body></html>
