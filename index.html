<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="UK cinema releases this week, with BBFC certificates, running times and reviews from British film critics.">
<title>UK Cinema Releases</title>
<style>
:root{color-scheme:light;--ink:#17202a;--muted:#596575;--line:#dce2e8;--paper:#fff;--accent:#245b8f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:780px;margin:0 auto;padding:36px 22px 64px}header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:28px}
h1{font-size:clamp(2rem,6vw,2.7rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.04em}
h2{font-size:1.35rem;margin:30px 0 12px}h3{font-size:1.05rem;margin:0 0 4px}
.meta,.muted{color:var(--muted);font-size:.9rem} .film{padding:17px 0;border-bottom:1px solid var(--line)}
.film-title{font-size:1.13rem;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.details{font-size:.9rem;color:var(--muted);margin:3px 0 8px}.review{margin:8px 0 4px}
.sources{font-size:.86rem}.sources a{margin-right:12px}
a{color:var(--accent)}footer{margin-top:38px;border-top:1px solid var(--line);padding-top:15px}
.empty{padding:18px;background:#f4f6f8;border-radius:8px;color:var(--muted)}
</style></head>
<body><main>
<header><h1>UK Cinema Releases</h1><div class="meta" id="week">Loading this week's releases…</div><div class="meta" id="updated"></div></header>
<div id="content" aria-live="polite"></div>
<footer class="meta">Release dates: <a href="https://filmdistributorsassociation.com/release-schedule/print-release-schedule/">Film Distributors’ Association</a>. Certificates and running times are shown only when verified. Reviews are short editorial summaries linked to their original UK critic sources. <a href="archive.html">Previous weeks</a></footer>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const google=t=>"https://www.google.com/search?q="+encodeURIComponent(t+" showtimes Bristol");
async function load(){const root=document.getElementById("content");try{const r=await fetch("data/current.json?"+Date.now());if(!r.ok)throw Error("data");const d=await r.json();document.getElementById("week").textContent=d.week_label||"This week's releases";document.getElementById("updated").textContent="Last updated: "+(d.updated||"date unavailable");
const sections=[["New releases",(d.films||[]).filter(x=>!x.rerelease)],["Re-releases",(d.films||[]).filter(x=>x.rerelease)]];
for(const [label,films] of sections){if(!films.length)continue;films.sort((a,b)=>(Number(!!b.review)-Number(!!a.review))||(Number(!!b.certificate)-Number(!!a.certificate))||a.title.localeCompare(b.title));const h=document.createElement("h2");h.textContent=label;root.append(h);for(const f of films){const el=document.createElement("article");el.className="film";const details=[f.certificate,f.runtime].filter(Boolean).join(" · ");const review=f.review?'<p class="review">'+esc(f.review)+'</p>':"";const links=(f.sources||[]).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.outlet)+'</a>').join("");el.innerHTML='<h3><a class="film-title" href="'+google(f.title)+'" target="_blank" rel="noopener">'+esc(f.title)+'</a></h3>'+(details?'<div class="details">'+esc(details)+'</div>':"")+review+(links?'<div class="sources">Critics: '+links+'</div>':"");root.append(el)}}
if(!d.films?.length)root.innerHTML='<p class="empty">The release feed has not populated yet. The weekly update runs automatically on Thursday evenings.</p>';
}catch(e){root.innerHTML='<p class="empty">The release list is temporarily unavailable. Please try again later.</p>'}}
load();
</script></body></html>
